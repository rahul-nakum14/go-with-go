# .air.toml — live reload config for development
# Install: go install github.com/air-verse/air@latest

root = "."
tmp_dir = "tmp"

[build]
  cmd        = "go build -o ./tmp/main ./cmd/api"
  bin        = "./tmp/main"
  delay      = 1000          # ms to wait after a file change
  exclude_dir = ["assets", "tmp", "vendor", "bin"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test\\.go"]
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true
